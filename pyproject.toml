[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-indexation"
version = "0.1.0"
description = "Local-first indexing and browsing for personal media archives."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
]

[project.scripts]
archive-index = "archive_index.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archive_index.web" = ["index.html", "app.css", "app.js"]
