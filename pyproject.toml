[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-indexation"
version = "0.1.0"
description = "Local-first indexing and browsing for personal media archives."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
]

[project.optional-dependencies]
quality-lar-cpu = [
    "torch==2.11.0+cpu",
    "torchvision==0.26.0+cpu",
    "timm>=1,<2",
    "numpy>=1.26,<3",
    "efficient-kan @ git+https://github.com/Blealtan/efficient-kan.git@7b6ce1c87f18c8bc90c208f6b494042344216b11",
]
quality-lar-cuda = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "timm>=1,<2",
    "numpy>=1.26,<3",
    "efficient-kan @ git+https://github.com/Blealtan/efficient-kan.git@7b6ce1c87f18c8bc90c208f6b494042344216b11",
]

[project.scripts]
archive-index = "archive_index.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archive_index.web" = ["index.html", "app.css", "app.js"]

[tool.uv]
conflicts = [
    [
        { extra = "quality-lar-cpu" },
        { extra = "quality-lar-cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "quality-lar-cpu" },
    { index = "pytorch-cu128", extra = "quality-lar-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "quality-lar-cpu" },
    { index = "pytorch-cu128", extra = "quality-lar-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
